set default=0
set timeout=-1
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod png
insmod halt
insmod reboot
insmod read
insmod cat
insmod ls
insmod part_gpt
insmod part_msdos
set gfxmode=1024x768x32
set gfxpayload=keep
terminal_output gfxterm
set menu_color_normal=light-cyan/blue
set menu_color_highlight=white/blue
set color_normal=light-cyan/blue
set color_highlight=white/blue

if [ -f /boot/grub/splash.png ]; then
    background_image /boot/grub/splash.png
fi

function show_donut_source {
    if [ -f /kernel/donut3d.c ]; then
        cat /kernel/donut3d.c
    else
        echo "No se encontro /kernel/donut3d.c en la ISO."
        echo "Comprueba que estas usando la ISO recien compilada."
    fi
}

function show_install_setup {
    clear
    echo "MINUX OS - INSTALL SETUP"
    echo ""
    echo "Buscando discos y particiones visibles para GRUB..."
    echo "Dispositivos detectados:"
    ls
    echo ""
    echo "Puedes consultar un dispositivo GRUB, por ejemplo:"
    echo "  (hd0)           disco completo"
    echo "  (hd0,gpt1)      primera particion GPT"
    echo "  (hd0,msdos1)    primera particion MBR"
    echo -n "Dispositivo para consultar (Enter para omitir): "
    read install_device
    if [ -n "$install_device" ]; then
        echo ""
        echo "Informacion que GRUB puede leer de $install_device:"
        ls "$install_device"
        echo ""
    fi
    echo "MODO SOLO LECTURA: no se modifico ningun disco."
    echo "Esto solo consulta el dispositivo; no es una instalacion."
    echo "No se formatea ni se escriben datos en ningun disco."
    echo "El kernel aun no tiene instalador ni controladores de disco."
    echo ""
    echo "Pulsa una tecla para continuar."
    read
}

function show_install_device {
    clear
    echo "MINUX OS - CONSULTA DE DISCO"
    echo ""
    echo "Dispositivo seleccionado: $1"
    echo "Respuesta de GRUB:"
    ls "$1"
    echo ""
    echo "SOLO LECTURA: no se escribio ni formateo el disco."
    echo "Esta pantalla no instala Minux."
    echo ""
    echo "Pulsa una tecla para volver al menu."
    read
}

menuentry "Iniciar Minux OS" {
    multiboot2 /boot/mininux.elf
    boot
}

menuentry "Minux OS - Install Setup (buscar discos)" {
    show_install_setup
}

submenu "Seleccionar disco (flechas y Enter, solo lectura)" {
    menuentry "Consultar disco (hd0)" {
        show_install_device '(hd0)'
    }
    menuentry "Consultar disco (hd1)" {
        show_install_device '(hd1)'
    }
    menuentry "Consultar disco (hd2)" {
        show_install_device '(hd2)'
    }
    menuentry "Consultar disco (hd3)" {
        show_install_device '(hd3)'
    }
    menuentry "Escribir otro dispositivo GRUB" {
        clear
        echo "Escribe un dispositivo como (hd0), (hd0,gpt1) o (hd0,msdos1)."
        echo "Consulta solamente; no se escribira en ningun disco."
        echo -n "Dispositivo: "
        read install_device
        if [ -n "$install_device" ]; then
            show_install_device "$install_device"
        fi
    }
}

menuentry "Iniciar kernel - DONUT3D" {
    multiboot2 /boot/mininux.elf donut3d
    boot
}

menuentry "Iniciar kernel - COKIESGAME" {
    multiboot2 /boot/mininux.elf cokiesgame
    boot
}

menuentry "Consola de comandos GRUB" {
    set current_dir=/
    echo "Comandos: help, pwd, ls, cd kernel|include|.., cat archivo, doom.py, installs setup"
    echo "Escribe donut3d.c o cat donut3d.c para ver el codigo fuente."
    echo "donut3d.h muestra una dona ASCII en GRUB (no inicia Minux)."
    while true; do
        echo -n "grub:$current_dir> "
        read command
        if [ "$command" = "help" ]; then
            echo "pwd                 muestra la carpeta actual"
            echo "ls                  lista los archivos de la carpeta"
            echo "cd kernel|include   cambia de carpeta"
            echo "cd ..               vuelve a la raiz"
            echo "cat donut3d.c       muestra el codigo C"
            echo "donut3d.c           alias para mostrar el codigo C"
            echo "cat donut3d.h       muestra el encabezado"
            echo "donut3d.h           muestra una dona ASCII sin arrancar Minux"
            echo "doom.py             muestra el archivo y como ejecutarlo fuera de GRUB"
            echo "cat doom.py         muestra el codigo Python incluido en la ISO"
            echo "installs setup      busca discos visibles; solo lectura, sin formato"
            echo "minux/donut3d/cokiesgame arrancan el kernel explicitamente"
            echo "reboot/halt         reinician/apagan; exit vuelve al menu"
        elif [ "$command" = "pwd" ]; then
            echo "$current_dir"
        elif [ "$command" = "ls" ]; then
            if [ "$current_dir" = "/" ]; then
                ls /
            else
                ls "$current_dir"
            fi
        elif [ "$command" = "cd kernel" ]; then
            set current_dir=/kernel
        elif [ "$command" = "cd /kernel" ]; then
            set current_dir=/kernel
        elif [ "$command" = "cd include" ]; then
            set current_dir=/include
        elif [ "$command" = "cd /include" ]; then
            set current_dir=/include
        elif [ "$command" = "cd .." ]; then
            set current_dir=/
        elif [ "$command" = "cat donut3d.c" ]; then
            show_donut_source
        elif [ "$command" = "donut3d.c" ]; then
            show_donut_source
        elif [ "$command" = "cat donut3d.h" ]; then
            cat /include/donut3d.h
        elif [ "$command" = "cat doom.py" ]; then
            if [ -f /doom.py ]; then
                cat /doom.py
            else
                echo "No se encontro /doom.py en la ISO."
            fi
        elif [ "$command" = "installs setup" ]; then
            show_install_setup
        elif [ "$command" = "installs" ]; then
            show_install_setup
        elif [ "$command" = "setup" ]; then
            show_install_setup
        elif [ "$command" = "doom.py" ]; then
            if [ -f /doom.py ]; then
                echo "GRUB no puede ejecutar scripts Python."
                echo "El archivo /doom.py esta incluido en esta ISO."
                echo "Usa 'cat doom.py' para ver su contenido."
                echo "Este script requiere Windows y Python (modulo msvcrt)."
                echo "Ejecutalo en Windows con: python doom.py"
            else
                echo "No se encontro /doom.py en la ISO."
            fi
        elif [ "$command" = "donut3d.h" ]; then
            clear
            echo ""
            echo "                    DONUT3D - SOLO GRUB"
            echo ""
            echo "                       .------."
            echo "                   .-'  .--.  '-."
            echo "                 .'    /    \    '."
            echo "                /     |      |     \\"
            echo "                |     |      |     |"
            echo "                \\     '.__.'     /"
            echo "                 '.             .'"
            echo "                   '-._______.-'"
            echo ""
            echo "No se inicio Minux ni se ejecuto codigo C."
            echo "Pulsa una tecla para volver al prompt."
            read
        elif [ "$command" = "minux" ]; then
            multiboot2 /boot/mininux.elf
            boot
        elif [ "$command" = "donut3d" ]; then
            multiboot2 /boot/mininux.elf donut3d
            boot
        elif [ "$command" = "cokiesgame" ]; then
            multiboot2 /boot/mininux.elf cokiesgame
            boot
        elif [ "$command" = "cookiesgame" ]; then
            multiboot2 /boot/mininux.elf cokiesgame
            boot
        elif [ "$command" = "reboot" ]; then
            reboot
        elif [ "$command" = "halt" ]; then
            halt
        elif [ "$command" = "exit" ]; then
            break
        else
            echo "Comando desconocido; escribe help."
        fi
    done
}

menuentry "Reiniciar equipo" {
    reboot
}

menuentry "Apagar equipo" {
    halt
}
